<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar venta por voz</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; text-align: center; }
  button { font-size: 18px; padding: 14px 28px; margin: 8px; border-radius: 8px; border: none; }
  #record { background: #d33; color: white; }
  #pauseResume { background: #666; color: white; }
  #finalize { background: #333; color: white; }
  #status { margin-top: 16px; color: #555; }
  #result { margin-top: 20px; padding: 12px; background: #f4f4f4; border-radius: 8px; text-align: left; min-height: 40px; }
  #result.invalid { background: #fee; color: #900; }
  #result.valid { background: #efe; color: #060; }
  a.confirm-link { display: inline-block; margin-top: 12px; font-size: 16px; }
  #diagnostics { margin-top: 16px; padding: 10px; background: #eef; border-radius: 8px; text-align: left; font-size: 12px; color: #333; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>Registrar venta por voz</h2>
  <button id="record">Grabar</button>
  <button id="pauseResume" disabled>⏸ Pausar</button>
  <button id="finalize" disabled>Finalizar</button>
  <div id="status">Listo para grabar.</div>
  <div id="result"></div>
  <div id="diagnostics"></div>

<script>
// Set once the intake workflow is confirmed working end-to-end (see Phase 4 -> Workflow A
// migration sequence): this always points at Workflow A's own permanent path, never Phase 4's.
const WEBHOOK_URL = 'https://aiautomationswork.app.n8n.cloud/webhook/phase9-audio-intake';

// Safari does not support 'audio/webm'. Detect what the browser actually supports
// instead of hardcoding a type, and use that same type consistently for both the
// MediaRecorder and the Blob sent to the server.
const MIME_CANDIDATES = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
function pickSupportedMimeType() {
  for (const type of MIME_CANDIDATES) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }
  return ''; // let the browser pick its own default if none of the candidates match
}
function extensionForMimeType(type) {
  if (type.includes('mp4')) return 'mp4';
  if (type.includes('ogg')) return 'ogg';
  return 'webm';
}

let mediaRecorder;
let chunks = [];
let selectedMimeType = '';
let appState = 'idle'; // idle | recording | paused | finalizing

const recordBtn = document.getElementById('record');
const pauseResumeBtn = document.getElementById('pauseResume');
const finalizeBtn = document.getElementById('finalize');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const diagEl = document.getElementById('diagnostics');

function logDiag(fields) {
  diagEl.textContent = Object.entries(fields).map(([k, v]) => `${k}: ${v}`).join('\n');
}

function setControlsForState(state) {
  appState = state;
  recordBtn.disabled = state !== 'idle';
  pauseResumeBtn.disabled = state !== 'recording' && state !== 'paused';
  pauseResumeBtn.textContent = state === 'paused' ? '▶ Reanudar' : '⏸ Pausar';
  finalizeBtn.disabled = state !== 'recording' && state !== 'paused';
}

recordBtn.addEventListener('click', async () => {
  chunks = [];
  resultEl.textContent = '';
  resultEl.className = '';
  diagEl.textContent = '';
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  selectedMimeType = pickSupportedMimeType();
  mediaRecorder = selectedMimeType
    ? new MediaRecorder(stream, { mimeType: selectedMimeType })
    : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = submitRecording;
  mediaRecorder.start();
  statusEl.textContent = 'Grabando...';
  setControlsForState('recording');
});

pauseResumeBtn.addEventListener('click', () => {
  if (appState === 'recording' && mediaRecorder.state === 'recording') {
    mediaRecorder.pause();
    statusEl.textContent = 'Pausado.';
    setControlsForState('paused');
  } else if (appState === 'paused' && mediaRecorder.state === 'paused') {
    mediaRecorder.resume();
    statusEl.textContent = 'Grabando...';
    setControlsForState('recording');
  }
  // any other appState (idle, finalizing) or state mismatch: no-op by design
});

finalizeBtn.addEventListener('click', () => {
  if (appState !== 'recording' && appState !== 'paused') return; // guards double-tap / invalid transitions
  setControlsForState('finalizing'); // disables pause/resume + finalize immediately
  statusEl.textContent = 'Procesando...';
  if (mediaRecorder.state === 'recording' || mediaRecorder.state === 'paused') {
    mediaRecorder.stop();
  }
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
});

async function submitRecording() {
  const actualType = mediaRecorder.mimeType || selectedMimeType || 'audio/webm';
  const blob = new Blob(chunks, { type: actualType });
  const ext = extensionForMimeType(actualType);
  const formData = new FormData();
  formData.append('audio_file', blob, `recording.${ext}`);

  let httpStatus = null;
  try {
    const res = await fetch(WEBHOOK_URL, { method: 'POST', body: formData });
    httpStatus = res.status;
    const data = await res.json();

    if (data.ok) {
      resultEl.className = 'valid';
      resultEl.innerHTML = `${data.message}<br><a class="confirm-link" href="${data.confirm_url}">Abrir confirmacion</a>`;
    } else {
      resultEl.className = 'invalid';
      const reasons = (data.invalid_reasons || []).map(r => `<li>${r}</li>`).join('');
      resultEl.innerHTML = `${data.message || 'No se pudo procesar la grabacion.'}${reasons ? `<ul>${reasons}</ul>` : ''}`;
    }

    logDiag({
      'MIME type usado': actualType,
      'Tamano del blob': blob.size + ' bytes',
      'Estado HTTP': httpStatus
    });
  } catch (err) {
    resultEl.className = 'invalid';
    resultEl.textContent = String(err);
    logDiag({
      'MIME type usado': actualType,
      'Tamano del blob': blob.size + ' bytes',
      'Estado HTTP': httpStatus ?? '(sin respuesta)'
    });
  } finally {
    statusEl.textContent = 'Listo para grabar.';
    setControlsForState('idle');
  }
}

setControlsForState('idle');
</script>
</body>
</html>
